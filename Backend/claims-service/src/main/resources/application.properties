# --- Service ---
spring.application.name=claims-service
server.port=8084

# --- Config Server (optionnel tant qu'il n'existe pas) ---
spring.config.import=optional:configserver:http://localhost:8888

# --- Base MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/claims_db
spring.datasource.username=claims
spring.datasource.password=claims

# --- JPA / Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka