spring.application.name=gateway
server.port=8086

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

logging.level.org.springframework.cloud.gateway.server.mvc=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.cloud.client.loadbalancer=DEBUG
logging.level.org.springframework.web.client=DEBUG

# MS1 property
spring.cloud.gateway.server.webmvc.routes[0].id=property
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/proprietes/**,/api/proprietaires/**


# MS3 pricing
spring.cloud.gateway.server.webmvc.routes[1].id=pricing
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/zone-scores/**,/api/quotes/**


# MS4 claims
spring.cloud.gateway.server.webmvc.routes[2].id=claims
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/claims/**,/api/expertises/**

# MS5 risk engine (paths still missing)
spring.cloud.gateway.server.webmvc.routes[3].id=risk-engine
spring.cloud.gateway.server.webmvc.routes[3].uri=http://127.0.0.1:8085
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/zones/**


